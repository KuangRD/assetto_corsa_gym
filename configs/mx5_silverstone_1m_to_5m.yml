load_offline_data: false
pre_train: false
dataset_path: null
work_dir: outputs/train_mx5cup_silverstone_1m2_to_5m_stable_resume_retry1
task: AssettoCorsaGym
seed: 0

disable_wandb: true
wandb_entity: null
wandb_project: sac
wandb_silent: false
exp_name: null
task_title: null
save_csv: true
save_video: false
save_agent: false
action_dim: null
steps: null

Agent:
  # The starting weights already represent 1,000,000 cumulative steps.
  # Run another 4,000,000 environment steps and label milestones with a
  # 1,000,000-step offset, producing step_01100000 through step_05000000.
  num_steps: 4_000_000
  batch_size: 128
  memory_size: 1_000_000
  offline_buffer_size: 12_000_000
  use_offline_buffer: false
  # After the 1.2M rollback, use one optimizer update per four samples.
  update_interval: 4
  # The legacy 1M checkpoint has no replay/optimizer state.  Collect a broad,
  # deterministic on-policy buffer before allowing any gradient updates.
  # The restored checkpoint is at 200k continuation steps.  Collect another
  # 50k deterministic samples before resuming gradients.
  start_steps: 250_000
  random_steps: 0
  warmup_deterministic: true
  log_interval: 10
  eval_interval: 100_000
  num_eval_episodes: 3
  checkpoint_freq: 100_000
  checkpoint_step_offset: 1_000_000
  stop_episode_at_eval_interval: true
  evaluation_report_dir: C:/Users/freedom/Documents/assetto_corsa_gym
  save_final_buffer: false
  save_checkpoint_file: true
  checkpoint_replay_buffer: true
  external_checkpoint_enabled: true
  external_checkpoint_poll_interval_steps: 25
  external_checkpoint_control_dir: outputs/train_mx5cup_silverstone_1m2_to_5m_stable_resume_retry1/control
  # Recovered from the final TensorBoard scalar of the 400k->1M run.
  initial_entropy_alpha: 0.00622557
  # Full checkpoints restore Adam moments; deliberately override only the LR
  # to make the post-rollback updates conservative.
  resume_policy_lr: 0.00003
  resume_q_lr: 0.00003
  resume_entropy_lr: 0.00001

SAC:
  gamma: 0.992
  nstep: 3
  # Adam moments do not exist in the legacy checkpoint, so restart the
  # optimizers conservatively instead of applying the original peak LR.
  policy_lr: 0.0001
  q_lr: 0.0001
  entropy_lr: 0.00003
  policy_hidden_units: [256, 256, 256]
  q_hidden_units: [256, 256, 256]
  target_update_coef: 0.005
  log_interval: 10

DisCor:
  error_lr: 0.0003
  error_hidden_units: [256, 256, 256, 256]
  tau_init: 10.0

AssettoCorsa:
  ego_sampling_freq: 25
  max_episode_py_time: 600.0
  gap_const: 12.0
  eval_number_of_laps: 1
  save_lap_csv: false
  remote_machine_ip: localhost
  ego_server_port: 2345
  opponents_server_port: 2346
  simulation_management_server_port: 2347
  use_relative_actions: true
  enable_sensors: true
  vjoy_executed_by_server: false
  enable_out_of_track_termination: true
  enable_low_speed_termination: true
  low_speed_termination_seconds: 20
  recover_car_on_done: false
  send_reset_at_start: true
  record_controls_from_client: false
  enable_out_of_track_penalty: false
  max_laps_number: null
  enable_task_id_in_obs: false
  penalize_actions_diff: false
  penalize_actions_diff_coef: 0.1
  max_steer_rate: 900.0
  track: ks_silverstone-gp
  car: ks_mazda_mx5_cup
  use_ac_out_of_track: true
  add_previous_obs_to_state: true
  use_reference_line_in_reward: true
  use_target_speed: false
  screen_capture_enable: false
  final_image_width: 320
  final_image_height: 240
  color_mode: gray
  use_obs_extra: false
